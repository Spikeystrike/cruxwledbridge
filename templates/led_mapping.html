<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grips and LEDs</title><style>
body{margin:0;background:#f2f4f6;color:#172636;font:16px system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:20px}h1{margin:0 0 12px}
nav,.actions,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}a{color:#155a9a}button,input,select{font:inherit;padding:8px;border:1px solid #99a9b8;border-radius:5px}button{cursor:pointer;background:#fff;color:#172636}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{background:#193d5d;color:white}button.primary{background:#16683e;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2c8de0}
label{display:flex;flex-direction:column;gap:5px}label.check{flex-direction:row;align-items:center}input[type=number]{width:110px}input.wide{width:min(600px,85vw)}.panel{padding:16px;background:white;border:1px solid #c6d1da;border-radius:8px;margin:12px 0}.muted{color:#4a5e6d;font-size:.92rem}#status{white-space:pre-wrap;min-height:24px}#status.error{color:#a11c1c}#state{font-weight:600}
[hidden]{display:none!important}#grip-frame{width:100%;height:85vh;border:0}#image-viewport{overflow:auto;max-height:75vh;touch-action:none;border-radius:8px;background:#1b242c}#picture{position:relative;line-height:0;width:100%;}#wall-image{width:100%;max-width:none;display:block;pointer-events:none;user-select:none}#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}svg text{font:12px sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px;fill:#111;pointer-events:none}svg circle{cursor:pointer;vector-effect:non-scaling-stroke}svg line{vector-effect:non-scaling-stroke}#table-wrap{overflow:auto;max-height:380px}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{text-align:left;padding:8px;border-bottom:1px solid #dbe2e7}tr.selected{background:#e4eff9}td button{padding:3px 7px}.bad{color:#a33510}#grip-surfaces,#corner-inputs{display:flex;gap:12px;flex-wrap:wrap}#grip-surfaces input{width:80px}details{margin:12px 0}summary{cursor:pointer}#extra-list>div,#subgrid-list>div{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}#cable-tools{position:sticky;top:0;z-index:2;background:#f2f4f6;padding:8px;border:1px solid #c6d1da}#cable-status{font-weight:600}
@media(max-width:600px){main{padding:10px}button{min-height:42px}.panel{padding:12px}.row{align-items:stretch}nav button{flex:1}#grip-frame{height:80vh}}
</style></head><body><main id="editor">
<h1 data-i18n="title"></h1>
<nav aria-label="Setup"><button id="grip-tab" data-i18n="step1"></button><button id="led-tab" data-i18n="step2"></button><button id="cable-tab" data-i18n="step3"></button><a href="__MOON__" data-i18n="moon"></a></nav>
<p id="state"></p>
<section id="grip-panel"><p data-i18n="griphelp"></p><iframe id="grip-frame" title="Grip positions" data-src="__GRIP_FRAME__"></iframe><button id="next-leds" class="primary" data-i18n="step2"></button></section>
<div id="led-workspace" hidden>
<p data-i18n="intro"></p>
<section class="panel" id="grid-panel">
<div class="row"><label><span data-i18n="grid"></span><select id="grid-select"></select></label><button id="add-grid" data-i18n="add"></button><button id="delete-grid" data-i18n="delete"></button></div>
<fieldset><legend data-i18n="derive"></legend><div class="row"><label><span data-i18n="grips"></span><select id="copy-source"></select></label><label><span data-i18n="placement"></span><select id="derive-mode"><option value="copy" data-i18n="copyexact"></option><option value="below" data-i18n="copybelow"></option><option id="derive-alternate" value="alternate" data-i18n="copyalternate"></option></select></label><label><span data-i18n="shift"></span><input id="derive-offset" type="number" step="0.1" min="0" value="0.5"></label><button id="copy-grid" data-i18n="copy"></button></div></fieldset>
<div id="grid-fields">
<div class="row"><label><span data-i18n="name"></span><input id="name" maxlength="100"></label><label><span data-i18n="surface"></span><input id="surface" maxlength="100"></label><label><span data-i18n="rows"></span><input id="rows" type="number" min="1" max="250"></label><label><span data-i18n="cols"></span><input id="columns" type="number" min="1" max="250"></label><label class="check"><input id="alternating" type="checkbox"><span data-i18n="alternating"></span></label><label class="check"><input id="offset" type="checkbox"><span data-i18n="offset"></span></label></div>
<div class="row"><button id="pick-corners" data-i18n="corners"></button><button id="add-point" data-i18n="addpoint"></button><button id="cancel-pick" data-i18n="cancel" hidden></button></div><p class="muted" data-i18n="cornerhelp"></p>
<details><summary data-i18n="extras"></summary><div id="extra-list"></div></details>
<div class="row"><label><span data-i18n="position"></span><select id="position-select"></select></label><button id="toggle-position" data-i18n="toggle"></button></div>
<details><summary data-i18n="precision"></summary><div id="corner-inputs"></div></details>
</div><button id="next-cable" class="primary" data-i18n="step3"></button>
</section>
<section id="cable-panel" class="panel" hidden>
<p data-i18n="cablehelp"></p>
<div class="row"><button id="use-patterns" data-i18n="patterns"></button><button id="new-path" data-i18n="newpath"></button><label><span data-i18n="cablestart"></span><input id="cable-start" type="number" min="0" value="0"></label></div>
<details id="pattern-controls" open><summary data-i18n="patterns"></summary><fieldset id="pattern-fields">
<div class="row"><label><span data-i18n="grid"></span><select id="cable-grid-select"></select></label><button id="earlier" data-i18n="earlier"></button><button id="later" data-i18n="later"></button><label><span data-i18n="start"></span><select id="start"><option value="bottom_left" data-i18n="bottom_left"></option><option value="bottom_right" data-i18n="bottom_right"></option><option value="top_left" data-i18n="top_left"></option><option value="top_right" data-i18n="top_right"></option></select></label><label><span data-i18n="path"></span><select id="path"><option value="vertical" data-i18n="vertical"></option><option value="horizontal" data-i18n="horizontal"></option></select></label><label><span data-i18n="physical"></span><input id="physical-start" type="number" min="0"></label></div>
<p class="muted" data-i18n="subhelp"></p><div class="row"><button id="select-subgrid" data-i18n="selectsub"></button><label><span data-i18n="name"></span><input id="subgrid-name" maxlength="100"></label><button id="create-subgrid" data-i18n="createsub"></button><button id="clear-selection" data-i18n="clearselection"></button></div><div id="subgrid-list"></div>
</fieldset></details>
<fieldset><legend data-i18n="gaps"></legend><p data-i18n="gaphelp"></p><div class="row"><button id="select-edge" data-i18n="selectedge"></button><label><span data-i18n="fromled"></span><input id="gap-from" type="number" min="0"></label><label><span data-i18n="toled"></span><input id="gap-to" type="number" min="0"></label><button id="find-edge" data-i18n="findedge"></button><label><span data-i18n="gapcount"></span><input id="gap-count" type="number" min="1" max="10000" value="1"></label><button id="insert-gap" data-i18n="insertgap"></button><button id="remove-gap" data-i18n="removegap"></button></div><p id="edge-status"></p></fieldset>
<label><span data-i18n="skip"></span><input class="wide" id="skipped" inputmode="numeric"></label><p class="muted" data-i18n="skiphelp"></p>
<details><summary data-i18n="gripsurfaces"></summary><p data-i18n="surfacehelp"></p><div id="grip-surfaces"></div><div class="row"><label><span data-i18n="lateral"></span><input id="tolerance" type="number" min="0.01" max="0.49" step="0.01"></label><label><span data-i18n="distance"></span><input id="distance" type="number" min="0.01" max="2" step="0.05"></label></div></details>
<button id="link-tab" data-i18n="links"></button>
</section>
<section class="panel" id="review-panel" hidden><p data-i18n="reviewhelp"></p>
<div class="row"><label><span data-i18n="selected"></span><select id="grip-select"></select></label><label><span data-i18n="below"></span><select id="below-override"></select></label><label><span data-i18n="above"></span><select id="above-override"></select></label></div>
<div class="row"><select id="test-side" aria-label="Lighting side"><option value="below" data-i18n="below"></option><option value="above" data-i18n="above"></option><option value="both" data-i18n="both"></option></select><button id="preview-grip" data-i18n="preview"></button><label class="check"><input id="issues-only" type="checkbox"><span data-i18n="issues"></span></label></div>
<div id="summary"></div><div id="table-wrap"><table><thead><tr><th data-i18n="grid"></th><th data-i18n="below"></th><th data-i18n="above"></th></tr></thead><tbody id="associations"></tbody></table></div></section>
<div class="actions"><button id="calculate" data-i18n="calculate"></button><button id="save-draft" data-i18n="draft"></button><button class="primary" id="activate" data-i18n="activate" disabled></button><button id="deactivate" data-i18n="deactivate"></button><button id="test-led" data-i18n="testled" disabled></button><button id="stop-preview" data-i18n="stop"></button></div>
<div id="cable-tools" hidden><div class="row"><button id="draw-path" data-i18n="continuepath"></button><button id="undo-cable" data-i18n="undo"></button><button id="pan-image" data-i18n="pan"></button></div><span id="cable-status"></span></div>
<div class="row"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit" data-i18n="fit"></button><button id="zoom-in" aria-label="Zoom in">+</button><span data-i18n="zoomhelp" class="muted"></span></div>
<div id="image-viewport"><div id="picture"><img id="wall-image" src="__IMAGE__" alt="Wall"><svg id="overlay" role="img" aria-label="Grips and LED positions"></svg></div></div>
</div><p id="status" role="status" aria-live="polite"></p>
</main>__LANGUAGE__<script>__SCRIPT__</script></body></html>
